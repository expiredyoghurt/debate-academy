<!doctype html>
<html lang="en">
<head> 
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debate Academy</title>
<meta name="description" content="Build debate arguments brick by brick and learn to answer rebuttals.">
<style>
:root{
  --ink:#1f2a44; --paper:#f7f2e8; --card:#fff; --line:#e3dac6; --muted:#667089;
  --gold:#f2a900; --red:#d9482b; --teal:#238b7e; --blue:#3a6ea5; --purple:#7b5ea7;
  --ok:#1f8a4c; --bad:#c0392b; --radius:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 "Avenir Next","Segoe UI","Trebuchet MS",system-ui,sans-serif}
h1,h2,h3{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;line-height:1.2;margin:.2em 0 .5em}
h1{font-size:2rem} h2{font-size:1.6rem} h3{font-size:1.2rem}
p{margin:.5em 0 .8em}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
a{color:var(--blue)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.logo{font-family:"Iowan Old Style",Georgia,serif;font-weight:700;font-size:1.2rem;letter-spacing:.02em;text-decoration:none;color:#fff;white-space:nowrap}
.logo span{color:var(--gold)}
.nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin}
.nav a{color:#cfd5e6;text-decoration:none;padding:6px 11px;border-radius:999px;font-size:.92rem;white-space:nowrap}
.nav a:hover{background:rgba(255,255,255,.1)}
.nav a.on{background:var(--gold);color:var(--ink);font-weight:700}
.xpchip{display:flex;align-items:center;gap:8px;font-size:.85rem;white-space:nowrap}
.xpchip .bar{width:84px;height:8px;background:rgba(255,255,255,.2);border-radius:99px;overflow:hidden}
.xpchip .bar i{display:block;height:100%;background:var(--gold)}
.xpchip .rank{color:var(--gold);font-weight:700}
.who{font-size:.85rem;color:#cfd5e6}
main{max-width:980px;margin:0 auto;padding:22px 16px 80px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 2px 0 rgba(31,42,68,.04)}
.muted{color:var(--muted)} .small{font-size:.88rem}
.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid.c3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}

/* ---------- controls ---------- */
.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:700;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.15)} .btn:active{transform:translateY(1px)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.danger{background:var(--bad)}
.btn.small{padding:5px 11px;font-size:.85rem;border-radius:8px}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.row-actions.between{justify-content:space-between}
label{display:block;font-weight:700;margin:12px 0 4px;font-size:.92rem}
input[type=text],input[type=password],input[type=search],select,textarea{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
textarea{min-height:92px;resize:vertical}
.err{color:var(--bad);font-weight:700;margin-top:10px;min-height:1.2em}
.tag{display:inline-block;font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;color:#fff;background:var(--muted)}
.tag.prop{background:var(--blue)} .tag.opp{background:var(--red)}
.tag.ok{background:var(--ok)} .tag.wait{background:var(--muted)}

/* ---------- login ---------- */
.login-wrap{max-width:440px;margin:7vh auto 0}
.login-hero{text-align:center;margin-bottom:18px}
.login-hero .big-logo{font-size:2.6rem;font-family:"Iowan Old Style",Georgia,serif;font-weight:700}
.login-hero .big-logo span{color:var(--gold);text-shadow:0 1px 0 var(--ink)}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;border:2px solid var(--ink);background:transparent;padding:9px;border-radius:10px;font-weight:700;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff}

/* ---------- missions ---------- */
.mission{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-left:8px solid var(--c,var(--ink));border-radius:var(--radius);padding:16px;transition:transform .1s,box-shadow .1s}
.mission:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(31,42,68,.12)}
.mission .ic{font-size:2rem;line-height:1}
.mission h3{margin:0 0 2px}
.mission p{margin:0;color:var(--muted);font-size:.92rem}
.mission .st{margin-top:6px;font-size:.8rem;font-weight:800;color:var(--c,var(--ink))}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.badge{display:flex;gap:8px;align-items:center;padding:6px 12px;border-radius:99px;border:2px solid var(--gold);background:#fff8e1;font-weight:700;font-size:.88rem}
.badge.locked{border-color:var(--line);background:#f1ede2;color:#9aa0b3;filter:grayscale(1)}
.notice{background:#fff8e1;border:2px solid var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.warnbar{background:#fdecea;border:2px solid var(--bad);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.warnbar code{background:#fff;padding:2px 6px;border-radius:6px;display:inline-block;margin:2px 0}

/* ---------- slides / learn ---------- */
.dots{display:flex;gap:6px;margin-bottom:10px}
.dot{width:26px;height:6px;border-radius:99px;background:var(--line)}
.dot.past{background:var(--teal)} .dot.on{background:var(--gold)}
.big{font-size:1.25rem}
.callout{background:#eef2fb;border-left:6px solid var(--blue);padding:12px 16px;border-radius:8px;margin:14px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.side{border-radius:12px;padding:6px 16px;color:#fff}
.side.prop{background:var(--blue)} .side.opp{background:var(--red)}
.motion-card{position:relative;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:22px 16px 14px;margin:14px 0;font-family:"Iowan Old Style",Georgia,serif;font-size:1.2rem}
.motion-card .mk{position:absolute;top:-11px;left:14px;background:var(--ink);color:#fff;font:700 .7rem/1 system-ui;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:99px}
.steps4{padding-left:0;list-style:none;display:grid;gap:8px}
.steps4 li{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.cracks{padding-left:18px;font-size:.94rem}
.defs{width:100%;border-collapse:collapse;margin:8px 0}
.defs td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.defs td:first-child{font-weight:800;white-space:nowrap;color:var(--teal)}

/* ---------- bricks ---------- */
.brick-row{display:block;width:100%;text-align:left;border:0;background:#fff;border-radius:10px;margin:8px 0;padding:0;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.08),inset 0 0 0 2px var(--c);color:var(--ink)}
.brick-row .bl{display:block;background:var(--c);color:var(--on);font-weight:800;letter-spacing:.07em;font-size:.82rem;padding:8px 14px}
.brick-row .bt{display:none;padding:10px 14px}
.brick-row.open .bt{display:block}
.brick-row:not(.open) .bl::after{content:"  · tap to reveal";font-weight:500;opacity:.85;letter-spacing:0;text-transform:none}
.brick-row .ask{display:block;font-size:.82rem;color:var(--muted);padding:0 14px 10px;font-style:italic}
.sample-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.sample-head .motion{font-family:"Iowan Old Style",Georgia,serif;font-weight:700}

/* ---------- drills ---------- */
.q-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.quote{font-size:1.18rem;background:#fff;border-left:6px solid var(--ink);padding:14px 16px;border-radius:8px;margin:12px 0}
.ctx{font-size:.9rem;color:var(--muted);margin:6px 0}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
.choice{border:0;border-radius:10px;padding:12px 8px;font-weight:800;background:var(--c);color:var(--on);box-shadow:0 3px 0 rgba(0,0,0,.25);transition:transform .08s,opacity .2s}
.choice:hover:not([disabled]){transform:translateY(-2px)}
.choice[disabled]{cursor:default}
.choice.dim{opacity:.3}
.choice.right{outline:5px solid var(--ok);outline-offset:2px}
.choice.wrong{outline:5px solid var(--bad);outline-offset:2px}
.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;font-weight:600}
.feedback.good{background:#e6f5ec;border:2px solid var(--ok)}
.feedback.bad{background:#fdecea;border:2px solid var(--bad)}
.feedback p{margin:.3em 0;font-weight:500}
.placed{display:grid;gap:6px;margin:10px 0}
.placed .brick-row{margin:0;cursor:default}
.pool{display:grid;gap:8px;margin-top:12px}
.pool button{text-align:left;background:#fff;border:2px dashed var(--ink);border-radius:10px;padding:10px 14px;color:var(--ink)}
.pool button:hover{background:#f1f4fb}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.result{text-align:center}
.result .score{font-size:3.2rem;font-family:"Iowan Old Style",Georgia,serif;font-weight:700}

/* ---------- workshop ---------- */
.motion-pick{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;color:var(--ink)}
.motion-pick:hover{border-color:var(--ink)}
.motion-pick.on{border-color:var(--ink);background:#eef2fb;box-shadow:inset 6px 0 0 var(--gold)}
.sidepick{display:flex;gap:10px;margin:8px 0}
.sidepick button{flex:1;padding:12px;border-radius:10px;border:2px solid var(--ink);background:#fff;font-weight:800;color:var(--ink)}
.sidepick button.on.prop{background:var(--blue);color:#fff;border-color:var(--blue)}
.sidepick button.on.opp{background:var(--red);color:#fff;border-color:var(--red)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 6px}
.chip{font-size:.78rem;background:#f1ede2;border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--muted)}
.chip.term{background:#e7f3f1;border-color:#b8ddd8;color:var(--teal);font-weight:700}
.editor{border:2px solid var(--c,var(--line));border-radius:12px;margin:14px 0;overflow:hidden;background:#fff}
.editor header{background:var(--c);color:var(--on);padding:8px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.editor header b{letter-spacing:.07em}
.editor header span{font-size:.85rem;opacity:.95}
.editor .in{padding:10px 14px 12px}
.editor textarea{border-color:var(--line)}
.editor .def{font-size:.86rem;color:var(--muted);margin:0 0 6px}
.checks{font-size:.86rem;margin-top:6px}
.checks .t{color:var(--bad)} .checks .g{color:var(--ok);font-weight:700}
.wallviz{display:grid;gap:4px;margin:6px 0 14px;max-width:420px}
.wrow{display:flex;gap:4px}
.wrow:nth-child(even){padding-left:22px}
.wrow i{display:block;height:24px;flex:1;border-radius:4px;background:var(--c);opacity:.2;transition:opacity .3s}
.wrow.on i{opacity:1}
.wrow:nth-child(even) i:last-child{flex:.5}
.preview{background:#fffdf6;border:2px dashed var(--line);border-radius:12px;padding:14px 16px;line-height:1.75}
.preview mark{background:none;padding:1px 3px;border-radius:4px;box-shadow:inset 0 -3px 0 var(--c)}
.sticky-save{position:sticky;bottom:0;background:linear-gradient(transparent,var(--paper) 30%);padding:18px 0 4px}

/* ---------- arena ---------- */
.case{display:block;width:100%;text-align:left;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;border-left:8px solid var(--c)}
.case:hover{box-shadow:0 6px 16px rgba(31,42,68,.12)}
.crackpick{display:block;width:100%;text-align:left;border:0;border-radius:10px;margin:8px 0;padding:0;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 2px var(--c);color:var(--ink)}
.crackpick .bl{display:block;background:var(--c);color:var(--on);font-weight:800;font-size:.8rem;letter-spacing:.07em;padding:7px 14px}
.crackpick .bt{display:block;padding:10px 14px}
.crackpick:hover:not([disabled]){box-shadow:inset 0 0 0 4px var(--ink)}
.crackpick.solid{opacity:.45}
.crackpick.cracked{box-shadow:inset 0 0 0 5px var(--bad)}
.crackpick.cracked .bl::after{content:"  💥 the crack"}

/* ---------- tables / admin ---------- */
table.t{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
table.t th,table.t td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
table.t th{background:#efe9d9;font-size:.82rem;text-transform:uppercase;letter-spacing:.05em}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:#f6f9ff}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:1.15rem;letter-spacing:.14em;background:#fff8e1;border:2px dashed var(--gold);padding:3px 10px;border-radius:8px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px;align-items:end}
.filters>div{min-width:150px;flex:1}
.stars button{background:none;border:0;font-size:1.6rem;padding:0 2px;color:#c9c2ae}
.stars button.on{color:var(--gold)}
.scroll-x{overflow-x:auto}

/* ---------- rebuttals ---------- */
.starter{display:inline-block;background:var(--c);color:var(--on);font-weight:800;padding:2px 10px;border-radius:99px;font-size:.88rem;white-space:nowrap}
.famhead{background:var(--c);color:var(--on);border-radius:12px;padding:12px 16px;margin-bottom:10px}
.famhead .fs{font-family:"Iowan Old Style",Georgia,serif;font-size:1.5rem;font-weight:700}
.famcard{background:#fff;border:1px solid var(--line);border-left:8px solid var(--c);border-radius:12px;padding:12px 16px;margin:10px 0}
.famcard h3{margin:0 0 2px}
.rbcard{background:#fff;border:1px solid var(--line);border-left:8px solid var(--c);border-radius:12px;padding:10px 14px;margin:8px 0}
.rbcard p{margin:.2em 0 .5em}
.say{background:#f4f1e8;border-radius:8px;padding:8px 12px;margin:6px 0}
.say span.l{font-weight:800;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
.say.you{background:#eef6f4}
.say mark{background:none;font-weight:800;box-shadow:inset 0 -3px 0 var(--c);padding:0 2px}
.starterpick{display:block;width:100%;text-align:left;border:0;border-radius:12px;padding:12px 16px;margin:8px 0;background:var(--c);color:var(--on);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.starterpick:hover{filter:brightness(1.08)}
.starterpick b{font-size:1.1rem}
.starterpick span{display:block;font-size:.88rem;font-weight:500}
.prefix{display:inline-block;background:var(--c);color:var(--on);font-weight:800;border-radius:8px 8px 0 0;padding:4px 12px;margin-top:12px}
details summary{cursor:pointer;font-weight:700;margin:10px 0}

/* ---------- modal / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,27,45,.6);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:50}
.modal{background:var(--paper);border-radius:16px;max-width:760px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal-head{display:flex;justify-content:space-between;gap:10px;align-items:start}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:99px;font-weight:700;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:pop .25s}
.toast.gain{background:var(--ok)} .toast.err{background:var(--bad)}
@keyframes pop{from{transform:translate(-50%,16px);opacity:0}}

/* ---------- printable cards ---------- */
.cards-sheet{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.idcard{border:2px dashed #555;border-radius:10px;padding:14px 16px;background:#fff;break-inside:avoid;font-size:.95rem}
.idcard .h{font-family:"Iowan Old Style",Georgia,serif;font-weight:700;font-size:1.15rem;border-bottom:3px solid var(--gold);padding-bottom:5px;margin-bottom:8px}
.idcard .nm{font-size:1.3rem;font-weight:800}
.idcard .row{display:flex;justify-content:space-between;gap:8px;margin-top:6px;align-items:baseline}
.idcard .row span:first-child{color:#555;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.idcard .val{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:1.1rem}
.idcard .url{font-size:.82rem;word-break:break-all;margin-top:8px;color:#333}
@media print{
  body{background:#fff}
  .topbar,.noprint,.toast,.warnbar{display:none!important}
  main{padding:0;max-width:none}
  .panel{border:0;box-shadow:none;padding:0}
  @page{margin:10mm}
}
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:2rem">Debate Academy needs JavaScript to run.</p></noscript>
<script src="/content.js"></script>
<script>
(() => {
'use strict';
const C = window.CONTENT;
const $app = document.getElementById('app');
const S = { token: null, role: null, me: null, stats: { awards: {}, submissions: {} }, adminDefaults: null };
try { S.token = localStorage.getItem('da_token'); S.role = localStorage.getItem('da_role'); } catch (e) {}

/* ============================ utilities ============================ */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'value') el.value = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const words = (t) => (String(t).trim().match(/\S+/g) || []).length;
const fmtDate = (ms) => ms ? new Date(ms).toLocaleString('en-SG', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const brickStyle = (k) => `--c:${C.BRICKS[k].color};--on:${C.BRICKS[k].on}`;
const sideClass = (s) => s === 'Proposition' ? 'prop' : 'opp';
const otherSide = (s) => s === 'Proposition' ? 'Opposition' : 'Proposition';

let toastTimer;
function toast(msg, type) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = h('div', { class: 'toast ' + (type || ''), role: 'status' }, msg);
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2800);
}
function modal(title, body) {
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  const ov = h('div', { class: 'overlay', onclick: (e) => { if (e.target === ov) close(); } },
    h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' },
      h('div', { class: 'modal-head' }, h('h2', {}, title), h('button', { class: 'btn small ghost', onclick: close }, 'Close')),
      body));
  document.addEventListener('keydown', onKey);
  document.body.append(ov);
  return close;
}
function mount(...nodes) { $app.replaceChildren(...nodes); window.scrollTo(0, 0); }

/* ============================== api ================================ */
async function api(path, { method = 'GET', body } = {}) {
  const headers = {};
  if (body !== undefined) headers['content-type'] = 'application/json';
  if (S.token) headers.authorization = 'Bearer ' + S.token;
  let res;
  try {
    res = await fetch('/api' + path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
  } catch (e) { throw new Error('Cannot reach the server. Check your internet connection.'); }
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (res.status === 401 && S.token && !path.startsWith('/login')) { signOut(); throw new Error('Please sign in again.'); }
  if (!res.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}
function setSession(token, role) {
  S.token = token; S.role = role;
  try { localStorage.setItem('da_token', token); localStorage.setItem('da_role', role); } catch (e) {}
}
function signOut() {

function buildSortItems(n) {
  const pool = [];
  C.SAMPLES.forEach((s) => C.BRICK_ORDER.forEach((k) => pool.push({ text: s.bricks[k], brick: k, motion: s.motion, side: s.side, point: s.bricks.point, arg: s.id })));
  const out = [], per = {};
  for (const it of shuffle(pool)) {
    if ((per[it.arg] || 0) >= 2) continue;
    per[it.arg] = (per[it.arg] || 0) + 1; out.push(it);
    if (out.length === n) break;
  }
  return out;
}

function hasProperNoun(text) {
  return text.split(/[.!?]\s+/).some((s) => s.trim().split(/\s+/).slice(1).some((w) => /^[A-Z][a-z]{2,}/.test(w)));
}
function checkBrick(key, text) {
  const b = C.BRICKS[key], n = words(text), t = text.toLowerCase(), tips = [];
  if (n < b.min) tips.push(`Aim for at least ${b.min} words (you have ${n}).`);
  if (key === 'point' && n > 0) {
    if (n > 35) tips.push('Keep your Point short and direct.');
    if ((text.match(/[.!?](\s|$)/g) || []).length > 1) tips.push('Your Point should be a single sentence.');
  }

    h('div', { class: 'row-actions between' },
      h('button', { class: 'btn danger small', onclick: async () => { if (confirm('Delete this submission permanently?')) { await api('/admin/submissions/' + id, { method: 'DELETE' }); close(); render(); } } }, 'Delete'),
      h('button', { class: 'btn gold', onclick: async () => { try { await api('/admin/submissions/' + id, { method: 'PATCH', body: { feedback: fb.value, stars } }); toast('Feedback saved', 'gain'); close(); render(); } catch (e) { toast(e.message, 'err'); } } }, 'Save feedback')));
  close = modal(s.kind === 'substantive' ? 'Substantive' : 'Rebuttal', body);
}

/* ============================ teacher: motions ===================== */
async function adminMotions() {
  const [{ motions }, { classes }] = await Promise.all([api('/admin/motions'), api('/admin/classes')]);
  const text = h('input', { type: 'text', maxlength: '300', placeholder: 'This House would…' });
  const kind = h('select', {}, h('option', { value: 'policy' }, 'Rule (THW…)'), h('option', { value: 'opinion' }, 'Opinion (THBT…)'));
  const cls = h('select', {}, h('option', { value: '' }, 'All classes'), classes.map((c) => h('option', { value: c.id }, c.name)));
  const hint = h('input', { type: 'text', maxlength: '400', placeholder: 'Optional hint pupils will see, e.g. “Think about Singapore.”' });
  const rows = motions.map((m) => h('tr', {}, h('td', {}, m.text, m.hint ? h('div', { class: 'small muted' }, m.hint) : null), h('td', {}, m.kind === 'policy' ? 'Rule' : 'Opinion'), h('td', {}, m.class_name || 'All classes'),
    h('td', {}, h('button', { class: 'btn small danger', onclick: async () => { if (confirm('Delete this motion?')) { await api('/admin/motions/' + m.id, { method: 'DELETE' }); render(); } } }, 'Delete'))));
  mount(adminShell(h('div', {}, h('h1', {}, 'Custom motions'),
    h('div', { class: 'panel' }, h('p', { class: 'small muted' }, 'Pupils always see the built-in motions. Add your own here and they appear in the Workshop.'),
      h('label', {}, 'Motion'), text, h('div', { class: 'filters' }, h('div', {}, h('label', {}, 'Type'), kind), h('div', {}, h('label', {}, 'Visible to'), cls)), h('label', {}, 'Hint (optional)'), hint,
      h('div', { class: 'row-actions' }, h('button', { class: 'btn gold', onclick: async () => {
        try { await api('/admin/motions', { method: 'POST', body: { text: text.value, kind: kind.value, hint: hint.value, classId: cls.value || null } }); render(); } catch (e) { toast(e.message, 'err'); } } }, 'Add motion'))),
    h('div', { class: 'scroll-x', style: 'margin-top:16px' }, motions.length ? h('table', { class: 't' }, h('thead', {}, h('tr', {}, ['Motion', 'Type', 'Visible to', ''].map((x) => h('th', {}, x)))), h('tbody', {}, rows)) : h('div', { class: 'panel muted' }, 'No custom motions yet.'))), '/a/motions'));
}

/* ============================== router ============================= */
const routes = {
  '/login': loginView, '/home': homeView, '/learn': learnView, '/toolkit': toolkitView, '/name': nameView, '/sort': sortView, '/order': orderView, '/build': buildView, '/work': workView,
  '/a/classes': adminClasses, '/a/pupils': adminPupils, '/a/cards': adminCards, '/a/subs': adminSubs, '/a/motions': adminMotions,
};
async function render() {
  let path = location.hash.slice(1) || '';
  if (!S.token) path = '/login';
  else if (!path || path === '/login') path = S.role === 'admin' ? '/a/classes' : '/home';
  else if (S.role === 'admin' && !path.startsWith('/a/')) path = '/a/classes';
  else if (S.role !== 'admin' && path.startsWith('/a/')) path = '/home';
  if (location.hash.slice(1) !== path) { history.replaceState(null, '', '#' + path); }
  try {
    const m = path.match(/^\/arena(?:\/([\w-]+))?$/);
    const lm = path.match(/^\/lab(?:\/([\w-]+))?$/);
    if (m) await arenaView(m[1]);
    else if (lm) await labView(lm[1]);
    else await (routes[path] || (S.role === 'admin' ? adminClasses : homeView))();
  } catch (e) {
    if (!S.token) return;
    mount(h('main', {}, h('div', { class: 'panel' }, h('h2', {}, 'Oops'), h('p', {}, e.message || 'Something went wrong.'), h('button', { class: 'btn', onclick: render }, 'Try again'))));
  }
}
window.addEventListener('hashchange', render);
render();
})();
</script>
</body>
</html>
