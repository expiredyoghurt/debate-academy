name = "debate-academy"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Static front end in ./public; the Worker only runs first for /api/*
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "debate-academy"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"   # from: npx wrangler d1 create debate-academy

# Optional secrets (until set, the teacher login is Admin / Password123):
#   npx wrangler secret put admin_user
#   npx wrangler secret put admin_password
